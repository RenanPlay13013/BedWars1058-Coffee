name: Deploy snapshot with Gradle

on:
  push:
    branches:
      - develop
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://repo.andrei1058.com
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Deploy snapshot with Gradle
        env:
          ORG_GRADLE_PROJECT_mvnUser: ${{ secrets.MVN_REPO_USER }}
          ORG_GRADLE_PROJECT_mvnPassword: ${{ secrets.MVN_REPO_PASS }}
          ANDEV_RES_ID: 1
        run: |
          sudo apt install jq -y
          curl -X GET https://api.andrei1058.dev/v1/resources/$ANDEV_RES_ID/versioning/current -H "Accept: application/json" >> version.json
          export UPDATE_VERSION=`jq '.version' version.json | tr -d '"'`
          echo "version=$UPDATE_VERSION-SNAPSHOT" > gradle.properties
          ./gradlew clean publish
          echo "UPDATE_VERSION=$UPDATE_VERSION" >> $GITHUB_ENV
